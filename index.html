
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mehrgan Elevator AR</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111;
  color: white;
  font-family: Tahoma, Arial, sans-serif;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#ui {
  position: fixed;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}

#touchLayer {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: auto;
  touch-action: none;
}

button, select {
  pointer-events: auto;
  touch-action: manipulation;
  color: white;
  background: rgba(25,25,25,.90);
  border: 1px solid #777;
  border-radius: 9px;
  padding: 10px 12px;
  font-size: 13px;
}

button:active {
  background: #087c57;
}

#start {
  position: absolute;
  z-index: 5;
  top: 45%;
  left: 50%;
  transform: translate(-50%,-50%);
  background: #087c57;
  font-size: 18px;
  padding: 16px 25px;
}

#top {
  position: absolute;
  z-index: 3;
  top: 10px;
  left: 8px;
  right: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 5px;
}

#status {
  background: rgba(0,0,0,.75);
  padding: 9px;
  border-radius: 8px;
  font-size: 11px;
  max-width: 48%;
}

#controls {
  position: absolute;
  z-index: 3;
  bottom: 10px;
  left: 7px;
  right: 7px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 5px;
}

.panel {
  background: rgba(0,0,0,.78);
  border: 1px solid #555;
  border-radius: 11px;
  padding: 7px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.panel-title {
  font-size: 10px;
  text-align: center;
  color: #ddd;
}

.pad {
  display: grid;
  grid-template-columns: repeat(3, 39px);
  grid-template-rows: repeat(3, 37px);
  gap: 3px;
  direction: ltr;
}

.pad button {
  padding: 2px;
  font-size: 17px;
}

#middle, #right {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

#middle button, #right button {
  min-width: 65px;
  padding: 9px 5px;
}

#note {
  position: absolute;
  z-index: 2;
  bottom: 145px;
  left: 8px;
  right: 8px;
  text-align: center;
  font-size: 11px;
  text-shadow: 0 1px 3px black;
}

.hidden { display: none !important; }

@media(max-width:390px) {
  button, select { font-size: 11px; }
  .pad { grid-template-columns: repeat(3, 34px); }
  #middle button, #right button { min-width: 57px; }
}
</style>
</head>

<body>

<div id="ui">

  <div id="touchLayer"></div>

  <button id="start">شروع نمایش AR</button>

  <div id="top" class="hidden">
    <div id="status">آماده شروع</div>

    <select id="surfaceMode">
      <option value="floor">کف</option>
      <option value="wall">دیوار</option>
    </select>

    <select id="step">
      <option value="0.05">۵ سانتی‌متر</option>
      <option value="0.10">۱۰ سانتی‌متر</option>
      <option value="0.20">۲۰ سانتی‌متر</option>
    </select>
  </div>

  <div id="note" class="hidden">
    سطح را پیدا کن و «قرار دادن» را بزن.
  </div>

  <div id="controls" class="hidden">

    <div class="panel">
      <div class="panel-title">حرکت افقی</div>
      <div class="pad">
        <span></span>
        <button id="forward">▲</button>
        <span></span>

        <button id="left">◀</button>
        <button id="place">قرار دادن</button>
        <button id="rightMove">▶</button>

        <span></span>
        <button id="backward">▼</button>
        <span></span>
      </div>
    </div>

    <div id="middle">
      <div class="panel">
        <div class="panel-title">ارتفاع</div>
        <button id="up">ارتفاع +</button>
        <button id="down">ارتفاع −</button>
      </div>

      <div class="panel">
        <div class="panel-title">چرخش</div>
        <button id="rotateLeft">↶ چرخش</button>
        <button id="rotateRight">چرخش ↷</button>
      </div>
    </div>

    <div id="right">
      <div class="panel">
        <div class="panel-title">مقیاس</div>
        <button id="bigger">بزرگ‌تر +</button>
        <button id="smaller">کوچک‌تر −</button>
      </div>

      <div class="panel">
        <button id="lock">قفل موقعیت</button>
        <button id="reset">بازنشانی</button>
      </div>
    </div>

  </div>
</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';

import { GLTFLoader } from
'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/loaders/GLTFLoader.js';


// عناصر صفحه
const startButton = document.getElementById('start');
const statusBox = document.getElementById('status');
const controls = document.getElementById('controls');
const topBar = document.getElementById('top');
const note = document.getElementById('note');
const touchLayer = document.getElementById('touchLayer');

const surfaceMode = document.getElementById('surfaceMode');
const stepSelect = document.getElementById('step');


// متغیرهای اصلی
let scene, camera, renderer;
let modelRoot, modelContent;
let reticle;
let xrSession = null;
let hitTestSource = null;
let hitTestRequested = false;

let placed = false;
let locked = false;
let currentHitMatrix = null;

let initialPosition = new THREE.Vector3();
let initialQuaternion = new THREE.Quaternion();
let initialScale = 1;

const worldUp = new THREE.Vector3(0,1,0);
const loader = new GLTFLoader();


// ایجاد صحنه
scene = new THREE.Scene();

camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.01,
  100
);


// ایجاد رندر
renderer = new THREE.WebGLRenderer({
  alpha: true,
  antialias: true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local');

document.body.appendChild(renderer.domElement);


// نورپردازی
scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x777777,
    2
  )
);

const directionalLight = new THREE.DirectionalLight(
  0xffffff,
  2
);

directionalLight.position.set(2,5,3);
scene.add(directionalLight);


// گروه مدل
modelRoot = new THREE.Group();
modelContent = new THREE.Group();

modelRoot.add(modelContent);
scene.add(modelRoot);

modelRoot.visible = false;


// بارگذاری آسانسور
loader.load(
  './elevator.glb',

  (gltf) => {

    const object = gltf.scene;

    modelContent.add(object);

    const box = new THREE.Box3().setFromObject(object);
    const size = new THREE.Vector3();

    box.getSize(size);

    // مرکز هندسی مدل
    const center = new THREE.Vector3();
    box.getCenter(center);

    object.position.sub(center);

    // فرض: محور بلندتر مدل، محور ارتفاع است.
    // در صورت متفاوت بودن جهت مدل، باید محور اصلاح شود.
    let axis = 'y';

    if (size.x > size.y && size.x > size.z) {
      axis = 'x';
    } else if (size.z > size.x && size.z > size.y) {
      axis = 'z';
    }

    if (axis === 'x') {
      object.rotation.z = Math.PI / 2;
    } else if (axis === 'z') {
      object.rotation.x = -Math.PI / 2;
    }

    // تنظیم کف مدل روی مبدأ
    const correctedBox = new THREE.Box3().setFromObject(object);
    object.position.y -= correctedBox.min.y;

    statusBox.textContent = 'مدل آسانسور آماده است';

  },

  undefined,

  (error) => {
    console.error(error);
    statusBox.textContent = 'خطا در بارگذاری مدل';
  }
);


// نشانگر سطح
const ring = new THREE.Mesh(
  new THREE.RingGeometry(0.08,0.11,32),
  new THREE.MeshBasicMaterial({
    color: 0x00ff88,
    side: THREE.DoubleSide
  })
);

reticle = ring;
reticle.matrixAutoUpdate = false;
reticle.visible = false;

scene.add(reticle);


// محاسبه جهت قرارگیری مدل
function getPlacement(matrix, mode) {

  const position = new THREE.Vector3();
  const quaternion = new THREE.Quaternion();
  const scale = new THREE.Vector3();

  matrix.decompose(position,quaternion,scale);

  let normal = new THREE.Vector3(0,0,1);

  if (mode === 'wall') {

    normal.set(0,1,0)
      .applyQuaternion(quaternion);

    normal.y = 0;

    if (normal.lengthSq() < 0.001) {
      normal.set(0,0,1);
    }

    normal.normalize();

  } else {

    camera.getWorldDirection(normal);
    normal.y = 0;

    if (normal.lengthSq() < 0.001) {
      normal.set(0,0,-1);
    }

    normal.normalize().negate();

  }

  // دستگاه مختصات با محور Y قائم
  const right = new THREE.Vector3()
    .crossVectors(worldUp,normal)
    .normalize();

  normal = new THREE.Vector3()
    .crossVectors(right,worldUp)
    .normalize();

  const basis = new THREE.Matrix4();

  basis.makeBasis(right,worldUp,normal);

  const resultQuaternion = new THREE.Quaternion()
    .setFromRotationMatrix(basis);

  return {
    position,
    quaternion: resultQuaternion
  };
}


// قرار دادن مدل روی سطح
function placeModel(matrix) {

  if (!modelContent.children.length) {
    statusBox.textContent = 'مدل هنوز بارگذاری نشده است';
    return;
  }

  const result = getPlacement(matrix,surfaceMode.value);

  modelRoot.position.copy(result.position);
  modelRoot.quaternion.copy(result.quaternion);

  modelRoot.visible = true;

  placed = true;
  locked = false;

  initialPosition.copy(modelRoot.position);
  initialQuaternion.copy(modelRoot.quaternion);
  initialScale = modelRoot.scale.x;

  reticle.visible = false;

  statusBox.textContent = 'مدل قرار گرفت';

}


// شروع AR
// درخواست مستقیم در رویداد لمس، بدون isSessionSupported و await قبلی
startButton.addEventListener('click', async () => {

  startButton.disabled = true;
  startButton.textContent = 'در حال اتصال...';

  try {

    if (!navigator.xr) {
      throw new Error('WebXR در این مرورگر در دسترس نیست');
    }

    xrSession = await navigator.xr.requestSession(
      'immersive-ar',
      {
        requiredFeatures: ['hit-test'],
        optionalFeatures: [
          'dom-overlay',
          'local-floor'
        ],
        domOverlay: {
          root: document.getElementById('ui')
        }
      }
    );

    await renderer.xr.setSession(xrSession);

    startButton.classList.add('hidden');
    controls.classList.remove('hidden');
    topBar.classList.remove('hidden');
    note.classList.remove('hidden');

    statusBox.textContent = 'دوربین را به سمت سطح بگیر';

    hitTestSource = null;
    hitTestRequested = false;

    xrSession.addEventListener('end', () => {

      startButton.classList.remove('hidden');
      startButton.disabled = false;
      startButton.textContent = 'شروع نمایش AR';

      controls.classList.add('hidden');
      topBar.classList.add('hidden');
      note.classList.add('hidden');

      hitTestSource = null;
      hitTestRequested = false;
      currentHitMatrix = null;

      placed = false;
      locked = false;
      modelRoot.visible = false;

    });

  } catch (error) {

    console.error('AR ERROR:',error);

    startButton.disabled = false;
    startButton.textContent = 'تلاش مجدد برای شروع AR';

    alert(
      'خطای شروع AR\n' +
      error.name + '\n' +
      error.message
    );

  }

});


// پردازش Hit Test
renderer.setAnimationLoop((time,frame) => {

  if (frame) {

    const session = renderer.xr.getSession();

    if (session && !hitTestRequested) {

      hitTestRequested = true;

      session.requestReferenceSpace('viewer')
        .then((referenceSpace) => {

          return session.requestHitTestSource({
            space: referenceSpace
          });

        })
        .then((source) => {

          hitTestSource = source;

        })
        .catch((error) => {

          console.error(error);
          statusBox.textContent = 'خطا در تشخیص سطح';

        });

    }


    if (hitTestSource) {

      const referenceSpace = renderer.xr.getReferenceSpace();

      const results = frame.getHitTestResults(hitTestSource);

      let selectedResult = null;

      for (const result of results) {

        const pose = result.getPose(referenceSpace);

        if (!pose) continue;

        const matrix = new THREE.Matrix4()
          .fromArray(pose.transform.matrix);

        const q = new THREE.Quaternion();
        const p = new THREE.Vector3();
        const s = new THREE.Vector3();

        matrix.decompose(p,q,s);

        const normal = new THREE.Vector3(0,1,0)
          .applyQuaternion(q)
          .normalize();

        if (surfaceMode.value === 'floor') {

          if (Math.abs(normal.dot(worldUp)) > 0.70) {
            selectedResult = result;
            break;
          }

        } else {

          if (Math.abs(normal.dot(worldUp)) < 0.35) {
            selectedResult = result;
            break;
          }

        }

      }


      if (selectedResult) {

        const pose = selectedResult.getPose(referenceSpace);

        currentHitMatrix = new THREE.Matrix4()
          .fromArray(pose.transform.matrix);

        reticle.matrix.copy(currentHitMatrix);

        reticle.visible = !placed;

        if (!placed) {
          statusBox.textContent =
            surfaceMode.value === 'floor'
            ? 'کف شناسایی شد؛ قرار دادن را بزن'
            : 'دیوار شناسایی شد؛ قرار دادن را بزن';
        }

      } else {

        reticle.visible = false;

        if (!placed) {
          statusBox.textContent = 'در حال جستجوی سطح...';
        }

      }

    }

  }

  renderer.render(scene,camera);

});


// قرار دادن مدل
document.getElementById('place').onclick = () => {

  if (currentHitMatrix && !placed) {
    placeModel(currentHitMatrix);
  } else if (placed) {
    statusBox.textContent = 'مدل قبلاً قرار گرفته است';
  } else {
    statusBox.textContent = 'ابتدا سطح را پیدا کن';
  }

};


// اندازه گام
function getStep() {
  return Number(stepSelect.value);
}


// حرکت مدل در راستای محورهای محلی
function moveLocal(x,y,z) {

  if (!placed || locked) return;

  const movement = new THREE.Vector3(x,y,z)
    .applyQuaternion(modelRoot.quaternion);

  modelRoot.position.addScaledVector(
    movement,
    getStep()
  );

}


// حرکت چهارجهته
document.getElementById('forward').onclick =
  () => moveLocal(0,0,-1);

document.getElementById('backward').onclick =
  () => moveLocal(0,0,1);

document.getElementById('left').onclick =
  () => moveLocal(-1,0,0);

document.getElementById('rightMove').onclick =
  () => moveLocal(1,0,0);


// ارتفاع
document.getElementById('up').onclick =
  () => moveLocal(0,1,0);

document.getElementById('down').onclick =
  () => moveLocal(0,-1,0);


// چرخش حول محور قائم مدل
document.getElementById('rotateLeft').onclick = () => {

  if (!placed || locked) return;

  modelRoot.rotateY(
    THREE.MathUtils.degToRad(-5)
  );

};

document.getElementById('rotateRight').onclick = () => {

  if (!placed || locked) return;

  modelRoot.rotateY(
    THREE.MathUtils.degToRad(5)
  );

};


// مقیاس
document.getElementById('bigger').onclick = () => {

  if (!placed || locked) return;

  modelRoot.scale.multiplyScalar(1.05);

};

document.getElementById('smaller').onclick = () => {

  if (!placed || locked) return;

  modelRoot.scale.multiplyScalar(0.95);

};


// قفل
document.getElementById('lock').onclick = (event) => {

  if (!placed) return;

  locked = !locked;

  event.target.textContent =
    locked ? 'بازکردن قفل' : 'قفل موقعیت';

  statusBox.textContent =
    locked ? 'موقعیت قفل شد' : 'موقعیت آزاد شد';

};


// بازنشانی
document.getElementById('reset').onclick = () => {

  if (!placed) return;

  locked = false;

  modelRoot.position.copy(initialPosition);
  modelRoot.quaternion.copy(initialQuaternion);
  modelRoot.scale.setScalar(initialScale);

  document.getElementById('lock').textContent =
    'قفل موقعیت';

  statusBox.textContent = 'مدل بازنشانی شد';

};


// تغییر سطح
surfaceMode.addEventListener('change', () => {

  placed = false;
  locked = false;

  modelRoot.visible = false;
  reticle.visible = false;

  currentHitMatrix = null;

  document.getElementById('lock').textContent =
    'قفل موقعیت';

  statusBox.textContent = 'در حال تشخیص سطح جدید...';

});


// کشیدن مدل با انگشت
let dragging = false;
let lastX = 0;
let lastY = 0;

touchLayer.addEventListener('pointerdown', (event) => {

  if (!placed || locked) return;

  dragging = true;

  lastX = event.clientX;
  lastY = event.clientY;

  touchLayer.setPointerCapture(event.pointerId);

});

touchLayer.addEventListener('pointermove', (event) => {

  if (!dragging || !placed || locked) return;

  const dx = event.clientX - lastX;
  const dy = event.clientY - lastY;

  lastX = event.clientX;
  lastY = event.clientY;

  const xrCamera = renderer.xr.isPresenting
    ? renderer.xr.getCamera(camera)
    : camera;

  xrCamera.getWorldDirection(
    new THREE.Vector3()
  );

  const right = new THREE.Vector3()
    .setFromMatrixColumn(xrCamera.matrixWorld,0);

  if (surfaceMode.value === 'floor') {

    right.y = 0;

    if (right.lengthSq() > 0) right.normalize();

    const forward = new THREE.Vector3()
      .setFromMatrixColumn(xrCamera.matrixWorld,2);

    forward.y = 0;

    if (forward.lengthSq() > 0) forward.normalize();

    modelRoot.position.addScaledVector(
      right,
      dx * 0.002
    );

    modelRoot.position.addScaledVector(
      forward,
      dy * 0.002
    );

  } else {

    modelRoot.position.addScaledVector(
      right,
      dx * 0.002
    );

    modelRoot.position.y -= dy * 0.002;

  }

});

touchLayer.addEventListener('pointerup', () => {
  dragging = false;
});

touchLayer.addEventListener('pointercancel', () => {
  dragging = false;
});


// اندازه صفحه
window.addEventListener('resize', () => {

  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

});

</script>

</body>
</html>
