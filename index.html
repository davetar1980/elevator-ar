
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نمایش سه‌بعدی آسانسور مهرگان</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Tahoma, sans-serif;
      background: #f2f3f5;
      text-align: center;
    }

    h2 {
      padding: 15px;
      color: #222;
    }

    model-viewer {
      width: 100%;
      height: 75vh;
      background: #ffffff;
    }

    #ar-button {
      background: #174c83;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px 24px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h2>مدل سه‌بعدی آسانسور مهرگان</h2>

  <model-viewer
    src="elevator.glb"
    alt="مدل سه‌بعدی آسانسور"
    camera-controls
    auto-rotate
    ar
    ar-modes="scene-viewer webxr"
    shadow-intensity="1"
    exposure="1">

    <button slot="ar-button" id="ar-button">
      مشاهده آسانسور در محیط واقعی (AR)
    </button>

  </model-viewer>

</body>
</html>
