
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Mehrgan Elevator AR</title>

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
</script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #171717;
  color: white;
  font-family: Tahoma, Arial, sans-serif;
}

#app {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
}

header {
  background: #202020;
  padding: 14px;
  text-align: center;
  font-size: 17px;
  font-weight: bold;
  border-bottom: 1px solid #444;
}

#viewer {
  flex: 1;
  min-height: 0;
  width: 100%;
  background: #252525;
}

model-viewer {
  width: 100%;
  height: 100%;
  background: #252525;
  --poster-color: #252525;
}

#status {
  min-height: 40px;
  padding: 10px;
  text-align: center;
  font-size: 12px;
  color: #ddd;
  background: #202020;
}

#buttons {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: #171717;
}

button {
  width: 100%;
  min-height: 49px;
  border: none;
  border-radius: 10px;
  font-family: inherit;
  font-size: 15px;
  font-weight: bold;
  color: white;
  cursor: pointer;
  touch-action: manipulation;
}

#startAR {
  background: #087c57;
}

#chooseModel {
  background: #174b78;
}

button:disabled {
  opacity: .45;
}

#fileInput {
  display: none;
}

#modelName {
  text-align: center;
  font-size: 11px;
  color: #aaa;
  direction: ltr;
  overflow-wrap: anywhere;
}

#arHint {
  font-size: 10px;
  color: #aaa;
  text-align: center;
  padding-bottom: 5px;
}
</style>
</head>

<body>

<div id="app">

  <header>
    مهرگان آسانبر اعتماد
    <div style="font-size:11px;font-weight:normal;margin-top:5px">
      سیستم نمایش سه‌بعدی آسانسور در محیط واقعی
    </div>
  </header>

  <div id="viewer">

    <model-viewer
      id="elevatorModel"
      src="./elevator.glb"
      ar
      ar-modes="webxr"
      ar-placement="floor"
      camera-controls
      touch-action="pan-y"
      shadow-intensity="1"
      exposure="1"
      environment-image="neutral"
      interaction-prompt="auto"
      alt="مدل سه بعدی آسانسور">

    </model-viewer>

  </div>

  <div id="status">
    در حال آماده‌سازی برنامه...
  </div>

  <div id="buttons">

    <button id="startAR" disabled>
      شروع نمایش AR
    </button>

    <button id="chooseModel">
      انتخاب فایل مدل GLB از گوشی
    </button>

    <input
      id="fileInput"
      type="file"
      accept=".glb,model/gltf-binary">

    <div id="modelName">
      elevator.glb
    </div>

    <div id="arHint">
      برای استفاده از AR، گوشی باید از WebXR پشتیبانی کند.
    </div>

  </div>

</div>

<script>
(function() {

  "use strict";

  const model = document.getElementById("elevatorModel");
  const startButton = document.getElementById("startAR");
  const chooseButton = document.getElementById("chooseModel");
  const fileInput = document.getElementById("fileInput");
  const statusBox = document.getElementById("status");
  const modelName = document.getElementById("modelName");

  let localModelURL = null;
  let modelLoaded = false;

  function setStatus(message) {
    statusBox.textContent = message;
  }

  // بررسی بارگذاری مدل
  model.addEventListener("load", function() {

    modelLoaded = true;
    startButton.disabled = false;

    setStatus("مدل با موفقیت بارگذاری شد.");

  });

  // خطای بارگذاری مدل
  model.addEventListener("error", function() {

    modelLoaded = false;
    startButton.disabled = true;

    setStatus("خطا در بارگذاری مدل. فایل GLB را بررسی کن.");

  });

  // آماده شدن قابلیت AR
  model.addEventListener("ar-status", function(event) {

    const state = event.detail.status;

    if (state === "session-started") {
      setStatus("نمایش AR شروع شد.");
    }

    if (state === "object-placed") {
      setStatus("مدل در محیط واقعی قرار گرفت.");
    }

    if (state === "failed") {
      setStatus("شروع AR ناموفق بود.");
    }

    if (state === "not-presenting") {
      setStatus("از حالت AR خارج شدی.");
    }

  });

  // انتخاب فایل از حافظه گوشی
  chooseButton.addEventListener("click", function() {

    fileInput.click();

  });

  // بارگذاری فایل انتخاب‌شده
  fileInput.addEventListener("change", function(event) {

    const file = event.target.files[0];

    if (!file) return;

    if (!file.name.toLowerCase().endsWith(".glb")) {

      alert("فقط فایل GLB قابل انتخاب است.");

      fileInput.value = "";
      return;

    }

    setStatus("در حال بارگذاری مدل جدید...");

    modelLoaded = false;
    startButton.disabled = true;

    const newURL = URL.createObjectURL(file);

    const previousURL = localModelURL;

    localModelURL = newURL;

    model.src = newURL;

    modelName.textContent = file.name;

    if (previousURL) {
      URL.revokeObjectURL(previousURL);
    }

    fileInput.value = "";

  });

  // شروع AR
  startButton.addEventListener("click", async function() {

    if (!modelLoaded) {

      setStatus("ابتدا منتظر بارگذاری مدل بمان.");

      return;

    }

    try {

      setStatus("در حال شروع AR...");

      if (!model.canActivateAR) {

        throw new Error(
          "قابلیت WebXR در حال حاضر آماده نیست."
        );

      }

      // درخواست شروع AR باید مستقیماً از کلیک کاربر باشد.
      await model.activateAR();

    } catch (error) {

      console.error("AR ERROR:", error);

      setStatus(
        "خطای AR: " + error.message
      );

      alert(
        "شروع AR ناموفق بود.\n" +
        error.name + "\n" +
        error.message
      );

    }

  });

  // آماده شدن کتابخانه
  if (customElements.get("model-viewer")) {

    setStatus("در حال بارگذاری مدل...");

  } else {

    customElements.whenDefined("model-viewer")
      .then(function() {
        setStatus("کتابخانه آماده شد؛ در حال بارگذاری مدل...");
      })
      .catch(function(error) {
        setStatus("خطا در آماده‌سازی نمایشگر سه‌بعدی.");
        console.error(error);
      });

  }

  // بررسی وضعیت بارگذاری
  if (model.loaded) {

    modelLoaded = true;
    startButton.disabled = false;

    setStatus("مدل آماده است.");

  }

})();
</script>

</body>
</html>
