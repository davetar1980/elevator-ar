
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Mehrgan Elevator AR</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #171717;
  color: white;
  font-family: Tahoma, Arial, sans-serif;
}

#scene {
  position: fixed;
  inset: 0;
  z-index: 1;
}

#scene canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#overlayRoot {
  position: fixed;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}

#topBar {
  position: absolute;
  top: 0;
  right: 0;
  left: 0;
  padding: 8px;
  background: rgba(20,20,20,.65);
  text-align: center;
  pointer-events: auto;
  border-bottom: 1px solid rgba(255,255,255,.12);
}

#brand {
  font-size: 14px;
  font-weight: bold;
}

#status {
  margin-top: 4px;
  font-size: 10px;
  color: #ddd;
}

#bottomBar {
  position: absolute;
  bottom: 0;
  right: 0;
  left: 0;
  padding: 12px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  background: rgba(20,20,20,.92);
  pointer-events: auto;
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.ar-active #bottomBar {
  display: none;
}

.ar-active #topBar {
  background: rgba(20,20,20,.25);
  border: none;
  pointer-events: none;
}

button, select {
  font-family: inherit;
  touch-action: manipulation;
}

button {
  min-height: 43px;
  border: 0;
  border-radius: 9px;
  color: white;
  font-size: 13px;
  font-weight: bold;
  background: #343434;
  cursor: pointer;
}

button:disabled {
  opacity: .4;
}

#startAR {
  background: #087c57;
  min-height: 48px;
  font-size: 15px;
}

#chooseModel {
  background: #174b78;
}

#fileInput {
  display: none;
}

#modelName {
  font-size: 10px;
  color: #bbb;
  text-align: center;
  direction: ltr;
  overflow-wrap: anywhere;
}

#instructions {
  font-size: 10px;
  line-height: 1.8;
  color: #bbb;
  text-align: center;
}

/* پنل شفاف تنظیمات */

#arPanel {
  position: absolute;
  top: 75px;
  right: 8px;
  left: auto;
  bottom: 12px;

  width: min(310px, calc(100vw - 16px));
  max-height: 55vh;

  overflow-y: auto;
  overscroll-behavior: contain;

  background: transparent;
  border: none;
  border-radius: 0;
  padding: 5px;

  pointer-events: auto;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

#panelHeader {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  margin-bottom: 7px;
}

#panelTitle {
  font-size: 12px;
  font-weight: bold;
  color: white;
  text-shadow: 0 1px 4px black;
}

#hidePanel {
  background: rgba(120,45,45,.75);
  min-height: 32px;
  padding: 0 9px;
  font-size: 11px;
}

.sectionTitle {
  font-size: 11px;
  color: #8bd5ff;
  margin: 9px 0 5px;
  font-weight: bold;
  text-shadow: 0 1px 4px black;
}

.controlGrid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
}

.controlGrid button {
  min-height: 36px;
  background: rgba(35,48,62,.70);
  border: 1px solid rgba(255,255,255,.20);
  font-size: 11px;
  box-shadow: 0 1px 4px rgba(0,0,0,.2);
}

.axisLabel {
  font-size: 10px;
  color: white;
  text-align: center;
  margin-bottom: 4px;
  text-shadow: 0 1px 4px black;
}

.axisBox {
  min-width: 0;
}

.pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
}

.pair button {
  background: rgba(40,55,72,.72);
}

#scaleControls button {
  background: rgba(20,100,80,.72);
}

#settings {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin-top: 8px;
}

.setting {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.setting label {
  font-size: 10px;
  color: white;
  text-shadow: 0 1px 4px black;
}
