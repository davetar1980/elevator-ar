
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mehrgan Elevator AR</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111;
  color: white;
  font-family: Tahoma, Arial, sans-serif;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

#ui {
  position: fixed;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}

#touchLayer {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: auto;
  touch-action: none;
}

button, select {
  pointer-events: auto;
  touch-action: manipulation;
  color: white;
  background: rgba(25,25,25,.90);
  border: 1px solid #777;
  border-radius: 9px;
  padding: 10px 12px;
  font-size: 13px;
}

button:active { background: #087c57; }

#start {
  position: absolute;
  z-index: 5;
  top: 43%;
  left: 50%;
  transform: translate(-50%,-50%);
  background: #087c57;
  font-size: 18px;
  padding: 16px 25px;
}

#chooseModel {
  position: absolute;
  z-index: 5;
  top: 55%;
  left: 50%;
  transform: translate(-50%,-50%);
  background: #174b78;
  font-size: 15px;
  padding: 13px 20px;
  white-space: nowrap;
}

#fileInput { display: none; }

#top {
  position: absolute;
  z-index: 3;
  top: 10px;
  left: 8px;
  right: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 5px;
}

#status {
  background: rgba(0,0,0,.8);
  padding: 9px;
  border-radius: 8px;
  font-size: 11px;
  max-width: 48%;
}

#controls {
  position: absolute;
  z-index: 3;
  bottom: 10px;
  left: 7px;
  right: 7px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 5px;
}

.panel {
  background: rgba(0,0,0,.82);
  border: 1px solid #555;
  border-radius: 11px;
  padding: 7px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.panel-title {
  font-size: 10px;
  text-align: center;
  color: #ddd;
}

.pad {
  display: grid;
  grid-template-columns: repeat(3, 39px);
  grid-template-rows: repeat(3, 37px);
  gap: 3px;
  direction: ltr;
}

.pad button {
  padding: 2px;
  font-size: 17px;
}

#middle, #right {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

#middle button, #right button {
  min-width: 65px;
  padding: 9px 5px;
}

#note {
  position: absolute;
  z-index: 2;
  bottom: 145px;
  left: 8px;
  right: 8px;
  text-align: center;
  font-size: 11px;
  text-shadow: 0 1px 3px black;
  pointer-events: none;
}

.hidden { display: none !important; }

@media(max-width:390px) {
  button, select { font-size: 11px; }
  .pad { grid-template-columns: repeat(3, 34px); }
  #middle button, #right button { min-width: 57px; }
}
</style>
</head>

<body>

<div id="ui">

  <div id="touchLayer"></div>

  <button id="start">شروع نمایش AR</button>
  <button id="chooseModel">انتخاب فایل مدل GLB</button>
  <input id="fileInput" type="file" accept=".glb,model/gltf-binary">

  <div id="top" class="hidden">
    <div id="status">در حال آماده‌سازی...</div>

    <select id="surfaceMode">
      <option value="floor">کف</option>
      <option value="wall">دیوار</option>
    </select>

    <select id="step">
      <option value="0.05">۵ سانتی‌متر</option>
      <option value="0.10">۱۰ سانتی‌متر</option>
      <option value="0.20">۲۰ سانتی‌متر</option>
    </select>
  </div>

  <div id="note" class="hidden">
    سطح را پیدا کن و دکمه قرار دادن را بزن.
  </div>

  <div id="controls" class="hidden">

    <div class="panel">
      <div class="panel-title">حرکت افقی</div>
      <div class="pad">
        <span></span>
        <button id="forward">▲</button>
        <span></span>
        <button id="left">◀</button>
        <button id="place">قرار دادن</button>
        <button id="rightMove">▶</button>
        <span></span>
        <button id="backward">▼</button>
        <span></span>
      </div>
    </div>

    <div id="middle">
      <div class="panel">
        <div class="panel-title">ارتفاع</div>
        <button id="up">ارتفاع +</button>
        <button id="down">ارتفاع −</button>
      </div>

      <div class="panel">
        <div class="panel-title">چرخش</div>
        <button id="rotateLeft">↶ چرخش</button>
        <button id="rotateRight">چرخش ↷</button>
      </div>
    </div>

    <div id="right">
      <div class="panel">
        <div class="panel-title">مقیاس</div>
        <button id="bigger">بزرگ‌تر +</button>
        <button id="smaller">کوچک‌تر −</button>
      </div>

      <div class="panel">
        <button id="lock">قفل موقعیت</button>
        <button id="reset">بازنشانی</button>
      </div>
    </div>

  </div>
</div>

<script type="module">

import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const $ = id => document.getElementById(id);

const startButton = $('start');
const chooseButton = $('chooseModel');
const fileInput = $('fileInput');
const statusBox = $('status');
const controls = $('controls');
const topBar = $('top');
const note = $('note');
const touchLayer = $('touchLayer');
const surfaceMode = $('surfaceMode');
const stepSelect = $('step');

let scene, camera, renderer;
let modelRoot, modelContent, reticle;

let xrSession = null;
let hitTestSource = null;
let hitTestRequested = false;

let placed = false;
let locked = false;
let modelReady = false;
let currentHitMatrix = null;

let initialPosition = new THREE.Vector3();
let initialQuaternion = new THREE.Quaternion();
let initialScale = 1;

let currentObjectURL = null;

const worldUp = new THREE.Vector3(0,1,0);

scene = new THREE.Scene();

camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.01,
  100
);

renderer = new THREE.WebGLRenderer({
  alpha: true,
  antialias: true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local');

document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2));

const light = new THREE.DirectionalLight(0xffffff,2);
light.position.set(2,5,3);
scene.add(light);

modelRoot = new THREE.Group();
modelContent = new THREE.Group();

modelRoot.add(modelContent);
scene.add(modelRoot);
modelRoot.visible = false;

const loader = new GLTFLoader();


// آزادسازی منابع مدل قبلی
function disposeObject(object) {
  object.traverse(child => {
    if (child.geometry) {
      child.geometry.dispose();
    }

    if (child.material) {
      const materials = Array.isArray(child.material)
        ? child.material
        : [child.material];

      materials.forEach(material => {
        for (const key in material) {
          const value = material[key];

          if (value && value.isTexture) {
            value.dispose();
          }
        }

        material.dispose();
      });
    }
  });
}


// آماده‌سازی مدل و اصلاح اولیه محور
function prepareModel(object) {

  const box = new THREE.Box3().setFromObject(object);
  const size = new THREE.Vector3();
  const center = new THREE.Vector3();

  box.getSize(size);
  box.getCenter(center);

  object.position.sub(center);

  // فرض اولیه: بلندترین محور مدل، ارتفاع است.
  let axis = 'y';

  if (size.x > size.y && size.x > size.z) {
    axis = 'x';
  } else if (size.z > size.x && size.z > size.y) {
    axis = 'z';
  }

  if (axis === 'x') {
    object.rotation.z = Math.PI / 2;
  } else if (axis === 'z') {
    object.rotation.x = -Math.PI / 2;
  }

  const correctedBox = new THREE.Box3().setFromObject(object);
  object.position.y -= correctedBox.min.y;
}


// بارگذاری مدل از آدرس یا فایل انتخاب‌شده
function loadModel(source, label, isLocal = false) {

  statusBox.textContent = 'در حال بارگذاری مدل...';

  modelReady = false;
  placed = false;
  locked = false;
  modelRoot.visible = false;
  reticle.visible = false;
  currentHitMatrix = null;

  while (modelContent.children.length) {
    const oldObject = modelContent.children[0];

    modelContent.remove(oldObject);
    disposeObject(oldObject);
  }

  modelRoot.position.set(0,0,0);
  modelRoot.quaternion.identity();
  modelRoot.scale.setScalar(1);

  $('lock').textContent = 'قفل موقعیت';

  loader.load(
    source,

    gltf => {

      const object = gltf.scene;

      prepareModel(object);
      modelContent.add(object);

      modelReady = true;

      statusBox.textContent = 'مدل آماده است: ' + label;

      if (isLocal && currentObjectURL) {
        URL.revokeObjectURL(currentObjectURL);
        currentObjectURL = null;
      }

    },

    progress => {

      if (progress.total > 0) {
        const percent = Math.round(
          progress.loaded / progress.total * 100
        );

        statusBox.textContent = 'بارگذاری مدل: ' + percent + '%';
      }

    },

    error => {

      console.error('MODEL ERROR:',error);

      statusBox.textContent = 'خطا در بارگذاری مدل';

      if (isLocal && currentObjectURL) {
        URL.revokeObjectURL(currentObjectURL);
        currentObjectURL = null;
      }

      alert('بارگذاری مدل ناموفق بود. فایل GLB را بررسی کن.');

    }
  );
}


// مدل پیش‌فرض
loadModel('./elevator.glb','elevator.glb');


// انتخاب فایل از حافظه گوشی
chooseButton.addEventListener('click', () => {
  fileInput.click();
});

fileInput.addEventListener('change', event => {

  const file = event.target.files[0];

  if (!file) return;

  if (!file.name.toLowerCase().endsWith('.glb')) {
    alert('لطفاً یک فایل با پسوند GLB انتخاب کن.');
    fileInput.value = '';
    return;
  }

  if (currentObjectURL) {
    URL.revokeObjectURL(currentObjectURL);
    currentObjectURL = null;
  }

  currentObjectURL = URL.createObjectURL(file);

  loadModel(
    currentObjectURL,
    file.name,
    true
  );

  fileInput.value = '';

});


// نشانگر تشخیص سطح
reticle = new THREE.Mesh(
  new THREE.RingGeometry(0.08,0.11,32),
  new THREE.MeshBasicMaterial({
    color: 0x00ff88,
    side: THREE.DoubleSide
  })
);

reticle.matrixAutoUpdate = false;
reticle.visible = false;
scene.add(reticle);


// محاسبه جهت قرارگیری مدل
function getPlacement(matrix,mode) {

  const position = new THREE.Vector3();
  const quaternion = new THREE.Quaternion();
  const scale = new THREE.Vector3();

  matrix.decompose(position,quaternion,scale);

  let normal = new THREE.Vector3(0,0,1);

  if (mode === 'wall') {

    normal.set(0,1,0).applyQuaternion(quaternion);
    normal.y = 0;

    if (normal.lengthSq() < 0.001) {
      normal.set(0,0,1);
    }

    normal.normalize();

  } else {

    camera.getWorldDirection(normal);
    normal.y = 0;

    if (normal.lengthSq() < 0.001) {
      normal.set(0,0,-1);
    }

    normal.normalize().negate();

  }

  const right = new THREE.Vector3()
    .crossVectors(worldUp,normal)
    .normalize();

  normal = new THREE.Vector3()
    .crossVectors(right,worldUp)
    .normalize();

  const basis = new THREE.Matrix4();
  basis.makeBasis(right,worldUp,normal);

  const resultQuaternion = new THREE.Quaternion()
    .setFromRotationMatrix(basis);

  return {
    position,
    quaternion: resultQuaternion
  };
}


// قرار دادن مدل
function placeModel(matrix) {

  if (!modelReady) {
    statusBox.textContent = 'مدل هنوز بارگذاری نشده است';
    return;
  }

  const result = getPlacement(matrix,surfaceMode.value);

  modelRoot.position.copy(result.position);
  modelRoot.quaternion.copy(result.quaternion);
  modelRoot.visible = true;

  placed = true;
  locked = false;

  initialPosition.copy(modelRoot.position);
  initialQuaternion.copy(modelRoot.quaternion);
  initialScale = modelRoot.scale.x;

  reticle.visible = false;

  statusBox.textContent = 'مدل قرار گرفت';
}


// شروع AR
startButton.addEventListener('click', async () => {

  if (!modelReady) {
    alert('ابتدا منتظر بارگذاری مدل بمان.');
    return;
  }

  startButton.disabled = true;
  startButton.textContent = 'در حال اتصال...';

  try {

    if (!navigator.xr) {
      throw new Error('WebXR در مرورگر در دسترس نیست');
    }

    xrSession = await navigator.xr.requestSession(
      'immersive-ar',
      {
        requiredFeatures: ['hit-test'],
        optionalFeatures: ['dom-overlay','local-floor'],
        domOverlay: {
          root: $('ui')
        }
      }
    );

    await renderer.xr.setSession(xrSession);

    startButton.classList.add('hidden');
    chooseButton.classList.add('hidden');

    controls.classList.remove('hidden');
    topBar.classList.remove('hidden');
    note.classList.remove('hidden');

    hitTestSource = null;
    hitTestRequested = false;

    statusBox.textContent = 'دوربین را به سمت سطح بگیر';

    xrSession.addEventListener('end',() => {

      startButton.classList.remove('hidden');
      startButton.disabled = false;
      startButton.textContent = 'شروع نمایش AR';

      chooseButton.classList.remove('hidden');

      controls.classList.add('hidden');
      topBar.classList.add('hidden');
      note.classList.add('hidden');

      hitTestSource = null;
      hitTestRequested = false;
      currentHitMatrix = null;

      placed = false;
      locked = false;
      modelRoot.visible = false;

    });

  } catch (error) {

    console.error('AR ERROR:',error);

    startButton.disabled = false;
    startButton.textContent = 'تلاش مجدد برای شروع AR';

    alert(
      'خطای شروع AR\n' +
      error.name + '\n' +
      error.message
    );

  }

});


// پردازش تشخیص سطح
renderer.setAnimationLoop((time,frame) => {

  if (frame) {

    const session = renderer.xr.getSession();

    if (session && !hitTestRequested) {

      hitTestRequested = true;

      session.requestReferenceSpace('viewer')
        .then(space => session.requestHitTestSource({
          space
        }))
        .then(source => {
          hitTestSource = source;
        })
        .catch(error => {
          console.error(error);
          statusBox.textContent = 'خطا در تشخیص سطح';
        });

    }

    if (hitTestSource) {

      const referenceSpace = renderer.xr.getReferenceSpace();
      const results = frame.getHitTestResults(hitTestSource);

      let selectedResult = null;

      for (const result of results) {

        const pose = result.getPose(referenceSpace);
        if (!pose) continue;

        const matrix = new THREE.Matrix4()
          .fromArray(pose.transform.matrix);

        const q = new THREE.Quaternion();
        const p = new THREE.Vector3();
        const s = new THREE.Vector3();

        matrix.decompose(p,q,s);

        const normal = new THREE.Vector3(0,1,0)
          .applyQuaternion(q)
          .normalize();

        if (surfaceMode.value === 'floor') {

          if (Math.abs(normal.dot(worldUp)) > 0.70) {
            selectedResult = result;
            break;
          }

        } else {

          if (Math.abs(normal.dot(worldUp)) < 0.35) {
            selectedResult = result;
            break;
          }

        }

      }

      if (selectedResult) {

        const pose = selectedResult.getPose(referenceSpace);

        currentHitMatrix = new THREE.Matrix4()
          .fromArray(pose.transform.matrix);

        reticle.matrix.copy(currentHitMatrix);
        reticle.visible = !placed;

        if (!placed) {
          statusBox.textContent = 'سطح پیدا شد؛ قرار دادن را بزن';
        }

      } else {

        reticle.visible = false;

        if (!placed) {
          statusBox.textContent = 'در حال جستجوی سطح...';
        }

      }

    }

  }

  renderer.render(scene,camera);

});


// قرار دادن
$('place').onclick = () => {

  if (currentHitMatrix && !placed) {
    placeModel(currentHitMatrix);
  } else if (!placed) {
    statusBox.textContent = 'ابتدا سطح را پیدا کن';
  }

};


// گام حرکت
function getStep() {
  return Number(stepSelect.value);
}


// حرکت محلی
function moveLocal(x,y,z) {

  if (!placed || locked) return;

  const movement = new THREE.Vector3(x,y,z)
    .applyQuaternion(modelRoot.quaternion);

  modelRoot.position.addScaledVector(movement,getStep());

}

$('forward').onclick = () => moveLocal(0,0,-1);
$('backward').onclick = () => moveLocal(0,0,1);
$('left').onclick = () => moveLocal(-1,0,0);
$('rightMove').onclick = () => moveLocal(1,0,0);

$('up').onclick = () => moveLocal(0,1,0);
$('down').onclick = () => moveLocal(0,-1,0);


// چرخش حول محور قائم
$('rotateLeft').onclick = () => {

  if (placed && !locked) {
    modelRoot.rotateY(THREE.MathUtils.degToRad(-5));
  }

};

$('rotateRight').onclick = () => {

  if (placed && !locked) {
    modelRoot.rotateY(THREE.MathUtils.degToRad(5));
  }

};


// مقیاس
$('bigger').onclick = () => {

  if (placed && !locked) {
    modelRoot.scale.multiplyScalar(1.05);
  }

};

$('smaller').onclick = () => {

  if (placed && !locked) {
    modelRoot.scale.multiplyScalar(0.95);
  }

};


// قفل موقعیت
$('lock').onclick = event => {

  if (!placed) return;

  locked = !locked;

  event.target.textContent =
    locked ? 'بازکردن قفل' : 'قفل موقعیت';

  statusBox.textContent =
    locked ? 'موقعیت قفل شد' : 'موقعیت آزاد شد';

};


// بازنشانی
$('reset').onclick = () => {

  if (!placed) return;

  locked = false;

  modelRoot.position.copy(initialPosition);
  modelRoot.quaternion.copy(initialQuaternion);
  modelRoot.scale.setScalar(initialScale);

  $('lock').textContent = 'قفل موقعیت';
  statusBox.textContent = 'مدل بازنشانی شد';

};


// تغییر سطح
surfaceMode.addEventListener('change',() => {

  placed = false;
  locked = false;

  modelRoot.visible = false;
  reticle.visible = false;
  currentHitMatrix = null;

  $('lock').textContent = 'قفل موقعیت';

  statusBox.textContent = 'در حال جستجوی سطح جدید...';

});


// کشیدن مدل با انگشت
let dragging = false;
let lastX = 0;
let lastY = 0;

touchLayer.addEventListener('pointerdown',event => {

  if (!placed || locked) return;

  dragging = true;

  lastX = event.clientX;
  lastY = event.clientY;

  touchLayer.setPointerCapture(event.pointerId);

});

touchLayer.addEventListener('pointermove',event => {

  if (!dragging || !placed || locked) return;

  const dx = event.clientX - lastX;
  const dy = event.clientY - lastY;

  lastX = event.clientX;
  lastY = event.clientY;

  const xrCamera = renderer.xr.getCamera(camera);

  const right = new THREE.Vector3()
    .setFromMatrixColumn(xrCamera.matrixWorld,0);

  if (surfaceMode.value === 'floor') {

    right.y = 0;
    right.normalize();

    const forward = new THREE.Vector3()
      .setFromMatrixColumn(xrCamera.matrixWorld,2);

    forward.y = 0;
    forward.normalize();

    modelRoot.position.addScaledVector(right,dx * 0.002);
    modelRoot.position.addScaledVector(forward,dy * 0.002);

  } else {

    modelRoot.position.addScaledVector(right,dx * 0.002);
    modelRoot.position.y -= dy * 0.002;

  }

});

touchLayer.addEventListener('pointerup',() => {
  dragging = false;
});

touchLayer.addEventListener('pointercancel',() => {
  dragging = false;
});


// تغییر اندازه پنجره
window.addEventListener('resize',() => {

  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth,window.innerHeight);

});


// نمایش خطاهای پیش‌بینی‌نشده
window.addEventListener('error',event => {
  console.error(event.error || event.message);
});

window.addEventListener('unhandledrejection',event => {
  console.error(event.reason);
});

</script>
</body>
</html>
